<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planeta Novo — Helmet 3D</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
</head>

<body>

    <model-viewer
        src="./helmet_apollo_11.glb"
        camera-controls
        auto-rotate
        rotation-per-second="8deg"
        interaction-prompt="none"
        shadow-intensity="1"
        exposure="1">
    </model-viewer>

</body>
</html>
