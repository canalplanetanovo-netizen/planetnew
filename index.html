<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Planeta Novo — Helmet 3D</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        body {
            position: relative;
        }

        model-viewer {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background: transparent !important;

            --poster-color: transparent;
            --progress-bar-color: transparent;

            cursor: grab;
        }

        model-viewer:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>

    <model-viewer
        id="helmet"
        src="./helmet_apollo_11.glb"

        camera-controls
        disable-zoom
        interaction-prompt="none"

        shadow-intensity="0"
        exposure="1"
        environment-image="neutral"

        camera-orbit="0deg 75deg 105%"
        min-camera-orbit="-35deg 62deg 95%"
        max-camera-orbit="35deg 88deg 115%"

        style="background: transparent !important;">
    </model-viewer>

    <script>
        const helmet = document.getElementById("helmet")

        let targetX = 0
        let targetY = 75

        let currentX = 0
        let currentY = 75

        let scrollOffset = 0
        let time = 0

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max)
        }

        window.addEventListener("mousemove", (event) => {
            const normalizedX =
                (event.clientX / window.innerWidth - 0.5) * 2

            const normalizedY =
                (event.clientY / window.innerHeight - 0.5) * 2

            targetX = normalizedX * 16
            targetY = 75 + normalizedY * 6
        })

        window.addEventListener("mouseleave", () => {
            targetX = 0
            targetY = 75
        })

        window.addEventListener("scroll", () => {
            scrollOffset = window.scrollY * 0.015
        })

        function animate() {
            time += 0.015

            // suavização
            currentX += (targetX - currentX) * 0.06
            currentY += (targetY - currentY) * 0.06

            // micro flutuação
            const floatY = Math.sin(time) * 1.2

            // scroll influencia levemente a rotação
            const scrollRotation =
                clamp(scrollOffset, -12, 12)

            helmet.cameraOrbit =
                `${currentX + scrollRotation}deg ${currentY + floatY}deg 105%`

            requestAnimationFrame(animate)
        }

        animate()
    </script>

</body>
</html>
